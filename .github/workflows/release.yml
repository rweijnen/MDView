name: Build and Release

# Pushes to main and pull requests only build and test.
# A release is created only when this workflow is started manually
# (Actions > Build and Release > Run workflow) on main.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      IS_RELEASE: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Refuse release from a branch other than main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        shell: pwsh
        run: |
          Write-Error "Releases can only be created from main (this run is on ${{ github.ref }})."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc, aarch64-pc-windows-msvc

      - name: Build x64
        run: cargo build --release --locked

      - name: Build x86
        run: cargo build --release --locked --target i686-pc-windows-msvc

      # The standalone viewer only: Total Commander has no ARM64 version that
      # could load a plugin; on Windows on ARM it runs the x64 plugin (#51).
      - name: Build ARM64 (standalone viewer)
        run: cargo build --release --locked --target aarch64-pc-windows-msvc --bin mdview

      - name: Run tests
        run: cargo test --release --locked

      # Known vulnerabilities in the dependencies (RustSec, #74) fail the build.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit dependencies
        run: cargo audit

      - name: Get current version
        if: env.IS_RELEASE == 'true'
        id: version
        shell: pwsh
        run: |
          $content = Get-Content Cargo.toml -Raw
          if ($content -match 'version\s*=\s*"(\d+)\.(\d+)\.(\d+)"') {
            $major = [int]$matches[1]
            $minor = [int]$matches[2]
            $patch = [int]$matches[3]
            $currentVersion = "$major.$minor.$patch"

            # Rollover versioning: increment patch, rollover minor at 10
            # Example: 0.1.9 -> 0.1.10 -> 0.2.0
            $newPatch = $patch + 1
            $newMinor = $minor
            if ($newPatch -gt 10) {
              $newMinor = $minor + 1
              $newPatch = 0
            }
            $newVersion = "$major.$newMinor.$newPatch"

            echo "current=$currentVersion" >> $env:GITHUB_OUTPUT
            echo "new=$newVersion" >> $env:GITHUB_OUTPUT
            echo "Current version: $currentVersion"
            echo "New version: $newVersion"
          }

      - name: Release notes from CHANGELOG.md
        if: env.IS_RELEASE == 'true'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.current }}"
          $lines = @(Get-Content CHANGELOG.md)
          $start = [Array]::IndexOf($lines, "## v$version")
          if ($start -lt 0) {
            Write-Error "CHANGELOG.md has no '## v$version' section. Add the release notes for v$version before releasing."
            exit 1
          }
          $end = $lines.Count
          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^## ') { $end = $i; break }
          }
          $notes = if ($end -gt $start + 1) { ($lines[($start + 1)..($end - 1)] -join "`n").Trim() } else { '' }
          if (-not $notes) {
            Write-Error "The '## v$version' section in CHANGELOG.md is empty. Add the release notes for v$version before releasing."
            exit 1
          }
          $body = @(
            "## MDView v$version",
            '',
            'Markdown viewer for Windows - Total Commander Lister plugin and standalone executable.',
            '',
            "## What's new",
            '',
            $notes,
            '',
            '## Installation',
            '',
            '**Total Commander Plugin:**',
            '1. Download the ZIP file',
            '2. Open it in Total Commander',
            '3. Follow the plugin installation prompts',
            '',
            '**Standalone:**',
            'Extract `mdview.exe` and run it from command line or associate with `.md` files.',
            '',
            '## Contents',
            '- `mdview.exe` - Standalone viewer (x64)',
            '- `mdview-arm64.exe` - Standalone viewer for Windows on ARM (ARM64)',
            '- `mdview.wlx` - Total Commander plugin (x86)',
            '- `mdview.wlx64` - Total Commander plugin (x64)',
            '- `pluginst.inf` - Plugin installer configuration',
            '',
            "``MDView-v$version-x64.zip`` and ``MDView-v$version-arm64.zip`` contain only the standalone viewer (``mdview.exe``) for x64 or ARM64, for winget or a plain standalone install."
          ) -join "`n"
          Set-Content -Path release-notes.md -Value $body -NoNewline
          Write-Output $body

      - name: Create release directory
        if: env.IS_RELEASE == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release

          # Copy x64 standalone exe
          Copy-Item "target\release\mdview.exe" "release\mdview.exe"

          # Copy ARM64 standalone exe (#51)
          Copy-Item "target\aarch64-pc-windows-msvc\release\mdview.exe" "release\mdview-arm64.exe"

          # Copy x64 plugin (rename dll to wlx64)
          Copy-Item "target\release\mdview_wlx.dll" "release\mdview.wlx64"

          # Copy x86 plugin (rename dll to wlx)
          Copy-Item "target\i686-pc-windows-msvc\release\mdview_wlx.dll" "release\mdview.wlx"

          # Copy documentation
          Copy-Item "pluginst.inf" "release\"
          Copy-Item "README.md" "release\"
          Copy-Item "LICENSE" "release\"

      - name: Create ZIP
        if: env.IS_RELEASE == 'true'
        shell: pwsh
        run: |
          Compress-Archive -Path "release\*" -DestinationPath "MDView-v${{ steps.version.outputs.current }}.zip"

      # One zip per architecture with only the standalone viewer, as
      # mdview.exe in both: for winget (#48) and a plain standalone install.
      - name: Create standalone ZIPs (x64, ARM64)
        if: env.IS_RELEASE == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.current }}'
          foreach ($arch in @(
              @{ Name = 'x64'; Exe = 'target\release\mdview.exe' },
              @{ Name = 'arm64'; Exe = 'target\aarch64-pc-windows-msvc\release\mdview.exe' })) {
            if (-not (Test-Path $arch.Exe)) { Write-Error "The $($arch.Name) viewer was not built: $($arch.Exe) is missing."; exit 1 }
            $dir = "standalone-$($arch.Name)"
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            Copy-Item $arch.Exe "$dir\mdview.exe"
            Copy-Item "LICENSE" "$dir\"
            Compress-Archive -Path "$dir\*" -DestinationPath "MDView-v$version-$($arch.Name).zip"
          }

      - name: Create Release
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.current }}
          name: MDView v${{ steps.version.outputs.current }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            MDView-v${{ steps.version.outputs.current }}.zip
            MDView-v${{ steps.version.outputs.current }}-x64.zip
            MDView-v${{ steps.version.outputs.current }}-arm64.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version in Cargo.toml
        if: env.IS_RELEASE == 'true'
        shell: pwsh
        run: |
          $content = Get-Content Cargo.toml -Raw
          # Only the first match: the [package] version, never a dependency's.
          $newContent = ([regex]'version\s*=\s*"\d+\.\d+\.\d+"').Replace($content, "version = `"${{ steps.version.outputs.new }}`"", 1)
          Set-Content -Path Cargo.toml -Value $newContent -NoNewline
          # Cargo.lock names MDView's version too (#74); only MDView's own
          # entry changes, no dependency is updated.
          cargo update --workspace
          if ($LASTEXITCODE -ne 0) { Write-Error 'Cargo.lock could not be updated to the new version.'; exit 1 }
          $locked = Select-String -Path Cargo.lock -Pattern '^name = "mdview"' -Context 0,1 | ForEach-Object { $_.Context.PostContext[0] }
          if ($locked -ne "version = `"${{ steps.version.outputs.new }}`"") { Write-Error "Cargo.lock has $locked for mdview, expected ${{ steps.version.outputs.new }}."; exit 1 }

      - name: Commit version bump
        if: env.IS_RELEASE == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "Bump version to ${{ steps.version.outputs.new }}"
          git push

  # Unit tests on Windows on ARM itself (#51). The GUI tests need a desktop
  # and run on x64 (gui-tests.yml).
  test-arm64:
    runs-on: windows-11-arm
    if: github.event_name != 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests (ARM64)
        run: cargo test --release --locked
